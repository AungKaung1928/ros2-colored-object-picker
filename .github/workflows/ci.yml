name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/colored_object_picker
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select colored_object_picker --event-handlers console_direct+
      - name: Package installed
        run: |
          source install/setup.bash
          ros2 pkg prefix colored_object_picker
      - name: Launch test (detector on an image topic, no camera)
        run: |
          source install/setup.bash
          cd src/colored_object_picker
          launch_test test/test_launch_detector.py
  logic-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy opencv-python-headless pyyaml pytest
      - run: python -m pytest -q test/ --ignore=test/test_launch_detector.py  # launch test runs in the ROS job
      - name: Demo image still reproduces
        run: PYTHONPATH=. python scripts/make_demo.py | grep -c . | grep -qx 3
